name: 'Index web view'

# Publishes site/ with community/index.json, rules.json and lists.json beside it, as GitHub Pages.
# Needs Pages enabled once in the repository settings, with "GitHub Actions" as the source.
on:
  push:
    branches: [main]
    paths: ['site/**', 'community/index.json', 'community/rules.json', 'community/lists.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Put the data beside the page
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp community/index.json community/rules.json community/lists.json _site/

      # Needs Pages switched on in the repository settings (Source: GitHub Actions); the token is
      # not allowed to do that itself ("Resource not accessible by integration").
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
