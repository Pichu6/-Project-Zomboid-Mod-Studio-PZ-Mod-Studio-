[package]
name = "pz-mod-studio"
version = "0.1.0"
description = "Project Zomboid Mod Studio"
authors = ["Pichu6"]
edition = "2021"

[lib]
name = "pz_mod_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
dirs-next = "2"
