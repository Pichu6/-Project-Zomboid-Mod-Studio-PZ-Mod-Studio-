name: 'Community index'

# Every registry proposed for community/index must be well formed before a person looks at it;
# on main, index.json (what the Studio downloads) is rebuilt from the registries.
on:
  pull_request:
    paths: ['community/**', 'scripts/community-index.js']
  push:
    branches: [main]
    paths: ['community/index/**', 'community/lists/**', 'scripts/community-index.js', 'scripts/community-lists.js']

permissions:
  contents: read

jobs:
  # Read-only: runs for pull requests from anyone.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Registries are well formed
        run: node scripts/community-index.js check

      - name: Players' lists are well formed
        run: node scripts/community-lists.js check

      - name: Rules file is well formed
        run: node -e "const r=require('./community/rules.json'); for (const x of r.load_after) if (!x.mod_id||!x.after||x.mod_id===x.after) throw new Error('bad rule '+JSON.stringify(x)); for (const x of r.incompatible) if (!x.a||!x.b||x.a===x.b) throw new Error('bad pair '+JSON.stringify(x)); console.log('rules.json ok')"

  # Writes: only on main, after the check passed.
  build:
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build index.json and lists.json
        run: |
          node scripts/community-index.js build
          node scripts/community-lists.js build

      - name: Commit them when they changed
        run: |
          if git diff --quiet -- community/index.json community/lists.json; then echo "index.json and lists.json unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add community/index.json community/lists.json
          git commit -m "The community index and lists, rebuilt from their files"
          git push
