name: 'Index web view'

# Publishes site/ with community/index.json and community/rules.json beside it, as GitHub Pages.
# Needs Pages enabled once in the repository settings, with "GitHub Actions" as the source.
on:
  push:
    branches: [main]
    paths: ['site/**', 'community/index.json', 'community/rules.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Put the data beside the page
        run: |
          mkdir -p _site
          cp site/index.html _site/
          cp community/index.json community/rules.json _site/

      # Needs Pages switched on in the repository settings (Source: GitHub Actions); the token is
      # not allowed to do that itself ("Resource not accessible by integration").
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
