[package]
name = "pz-mod-studio"
version = "1.0.0"
description = "Project Zomboid Mod Studio"
authors = ["Pichu6"]
license = "MIT"
repository = "https://github.com/Pichu6/Project-Zomboid-Mod-Studio"
edition = "2021"
default-run = "pz-mod-studio"

[lib]
name = "pz_mod_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pz-mod-studio"
path = "src/main.rs"

[[bin]]
name = "pz-mcp-server"
path = "src/bin/mcp_server.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
dirs-next = "2"
full_moon = "0.10"
similar = "2.6"
rfd = "0.15"
open = "5.3"
chrono = "0.4"
