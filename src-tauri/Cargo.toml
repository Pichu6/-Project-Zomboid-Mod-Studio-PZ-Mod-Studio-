[package]
name = "pz-mod-studio"
version = "1.0.0"
description = "Project Zomboid Mod Studio"
authors = ["Pichu6"]
license = "MIT"
repository = "https://github.com/Pichu6/Project-Zomboid-Mod-Studio"
edition = "2021"
default-run = "pz-mod-studio"

[lib]
name = "pz_mod_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "pz-mod-studio"
path = "src/main.rs"

[[bin]]
name = "pz-mcp-server"
path = "src/bin/mcp_server.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
dirs-next = "2"
full_moon = "2.2"
similar = "2.6"
rfd = "0.15"
open = "5.3"
chrono = "0.4"
png = "0.17"
ureq = { version = "3.4.2", default-features = false, features = ["native-tls", "json", "gzip"] }
keyring-core = "=1.0.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate", "deflate64"] }
sevenz-rust = "0.6"

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1.1.0"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
