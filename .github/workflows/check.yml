name: 'Check'

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      # Actions pinned to commits (the tag they were on 2026-10-20 in the comment).
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      # Type-checks and builds dist/, which the Rust build embeds.
      - name: Build frontend
        run: npm run build

      - name: Frontend tests
        run: npm test

      - name: Rust tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Build MCP server
        run: cargo build --bin pz-mcp-server --manifest-path src-tauri/Cargo.toml

      - name: Release scripts work (sign and verify with a throwaway key)
        shell: bash
        run: node scripts/verify-release.cjs --self-test
